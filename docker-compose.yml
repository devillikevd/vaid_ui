# ═══════════════════════════════════════════════════════════════════
# SWASTIK Healthcare Platform — Docker Compose
# ═══════════════════════════════════════════════════════════════════
#
# Profiles:
#   default  → backend + ai-service + web + redis + minio  (local dev)
#   full     → adds MongoDB (if not using Atlas)
#   production → adds Nginx reverse proxy with SSL
#
# Usage:
#   docker compose up -d                        # local dev stack
#   docker compose --profile full up -d         # + local MongoDB
#   docker compose --profile production up -d   # + Nginx SSL proxy
#
# ═══════════════════════════════════════════════════════════════════

services:

  # ==================== NODE.JS BACKEND API ====================
  backend:
    build:
      context: ./swastik-backend
      dockerfile: Dockerfile
    container_name: swastik-backend
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - AI_SERVICE_URL=http://ai-service:8000
      - REDIS_URL=redis://:${REDIS_PASSWORD:-supersecretredis123}@redis:6379
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vaididea}:${POSTGRES_PASSWORD:-vaididea}@postgres:5432/${POSTGRES_DB:-health_library}?schema=public
    env_file:
      - ./swastik-backend/.env
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - swastik-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5001/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ==================== PYTHON AI SERVICE (FastAPI) ====================
  ai-service:
    build:
      context: ./swastik-ai-service
      dockerfile: Dockerfile
    container_name: swastik-ai-service
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_PORT=8000
      - AI_SERVICE_WORKERS=2
      - BACKEND_URL=http://backend:5001
      - REDIS_URL=redis://:${REDIS_PASSWORD:-supersecretredis123}@redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}

      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - MONGODB_URI=${MONGODB_URI:-}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-swastik_healthcare}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - swastik-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ==================== NEXT.JS WEB PORTAL ====================
  web:
    build:
      context: ./swastik-web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5001/api}
        - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-http://localhost:5001}
        - NEXT_PUBLIC_AI_WS_URL=${NEXT_PUBLIC_AI_WS_URL:-ws://localhost:8000}
    container_name: swastik-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - swastik-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: swastik-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-supersecretredis123}
    volumes:
      - redis_data:/data
    networks:
      - swastik-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-supersecretredis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== MINIO (Object Storage) ====================
  minio:
    image: minio/minio:latest
    container_name: swastik-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_telemedicine}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Str0ngM1n10P@ss!}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - swastik-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==================== MONGODB (Optional) ====================
  # Use only if NOT using MongoDB Atlas
  mongodb:
    image: mongo:7
    container_name: swastik-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin_swastik}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-Str0ngM0ng0P@ss!}
      MONGO_INITDB_DATABASE: swastik_healthcare
    volumes:
      - mongodb_data:/data/db
    networks:
      - swastik-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - full

  # ==================== NGINX (Reverse Proxy + SSL) ====================
  # Used in production for HTTPS termination
  nginx:
    image: nginx:alpine
    container_name: swastik-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - swastik-network
    restart: unless-stopped
    profiles:
      - production
  # ==================== POSTGRESQL (Health Library DB) ====================
  postgres:
    image: postgres:16-alpine
    container_name: swastik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaididea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaididea}
      POSTGRES_DB: ${POSTGRES_DB:-health_library}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - swastik-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vaididea} -d $${POSTGRES_DB:-health_library}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  swastik-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  minio_data:
    driver: local
  mongodb_data:
    driver: local
  postgres_data:
    driver: local
