name: Build & Test Ambulance App

on:
  push:
    branches: [ "main" ]
    paths:
      - "ambulance-app/**"
      - ".github/workflows/deploy-ambulance-app.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "ambulance-app/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :ambulance-app:assembleDebug

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ambulance-app-debug-apk
          path: ambulance-app/build/outputs/apk/debug/*.apk
