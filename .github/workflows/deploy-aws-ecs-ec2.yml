name: Deploy Backend and AI to ECS

on:
  push:
    branches:
      - main
    paths:
      - "swastik-backend/**"
      - "swastik-ai-service/**"
      - ".github/workflows/deploy-aws-ecs-ec2.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecs-prod-deploy
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'swastik' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'prod' }}
  PLATFORM: linux/arm64
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_TO_ASSUME }}

jobs:
  deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-24.04-arm
    environment: AWS_ROLE_TO_ASSUME

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Validate AWS role input
        shell: bash
        run: |
          if [[ -z "${AWS_ROLE_TO_ASSUME}" ]]; then
            echo "::error::Set AWS_ROLE_TO_ASSUME as a repository variable or secret in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deployment names
        id: names
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          cluster="${PROJECT_NAME}-${ENVIRONMENT}-cluster"
          service="${PROJECT_NAME}-${ENVIRONMENT}-app"
          backend_repo="${PROJECT_NAME}-${ENVIRONMENT}-backend"
          ai_repo="${PROJECT_NAME}-${ENVIRONMENT}-ai-service"

          echo "account_id=${account_id}" >> "${GITHUB_OUTPUT}"
          echo "registry=${registry}" >> "${GITHUB_OUTPUT}"
          echo "cluster=${cluster}" >> "${GITHUB_OUTPUT}"
          echo "service=${service}" >> "${GITHUB_OUTPUT}"
          echo "backend_repo=${backend_repo}" >> "${GITHUB_OUTPUT}"
          echo "ai_repo=${ai_repo}" >> "${GITHUB_OUTPUT}"
          echo "backend_image=${registry}/${backend_repo}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "backend_latest=${registry}/${backend_repo}:latest" >> "${GITHUB_OUTPUT}"
          echo "ai_image=${registry}/${ai_repo}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "ai_latest=${registry}/${ai_repo}:latest" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'swastik-backend/package-lock.json'

      - name: Backend tests
        working-directory: swastik-backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          SUPABASE_URL: https://ci-test.supabase.co
          SUPABASE_ANON_KEY: ci-test-supabase-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-test-supabase-service-role-key
        run: |
          npm ci
          npm test -- --runInBand

      - name: AI syntax check
        working-directory: swastik-ai-service
        run: python -m py_compile main.py

      - name: Login to ECR
        shell: bash
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${{ steps.names.outputs.registry }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build and push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./swastik-backend
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ steps.names.outputs.backend_image }}
            ${{ steps.names.outputs.backend_latest }}

      - name: Build and push AI service
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./swastik-ai-service
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ steps.names.outputs.ai_image }}
            ${{ steps.names.outputs.ai_latest }}

      - name: ECR Scan Gate (Backend)
        shell: bash
        run: |
          aws ecr wait image-scan-complete \
            --repository-name "${{ steps.names.outputs.backend_repo }}" \
            --image-id imageTag="${GITHUB_SHA}" || true
          
          scan_findings=$(aws ecr describe-image-scan-findings \
            --repository-name "${{ steps.names.outputs.backend_repo }}" \
            --image-id imageTag="${GITHUB_SHA}" \
            --query 'imageScanFindings.findingSeverityCounts' \
            --output json 2>/dev/null || echo "{}")
            
          high=$(echo "$scan_findings" | jq -r '.HIGH // 0')
          critical=$(echo "$scan_findings" | jq -r '.CRITICAL // 0')
          
          if [[ "$high" -gt 0 ]] || [[ "$critical" -gt 0 ]]; then
            echo "::error::CRITICAL ($critical) or HIGH ($high) vulnerabilities found in backend image."
            exit 1
          else
            echo "Backend image passed ECR vulnerability scan."
          fi

      - name: ECR Scan Gate (AI Service)
        shell: bash
        run: |
          aws ecr wait image-scan-complete \
            --repository-name "${{ steps.names.outputs.ai_repo }}" \
            --image-id imageTag="${GITHUB_SHA}" || true
          
          scan_findings=$(aws ecr describe-image-scan-findings \
            --repository-name "${{ steps.names.outputs.ai_repo }}" \
            --image-id imageTag="${GITHUB_SHA}" \
            --query 'imageScanFindings.findingSeverityCounts' \
            --output json 2>/dev/null || echo "{}")
            
          high=$(echo "$scan_findings" | jq -r '.HIGH // 0')
          critical=$(echo "$scan_findings" | jq -r '.CRITICAL // 0')
          
          if [[ "$high" -gt 0 ]] || [[ "$critical" -gt 0 ]]; then
            echo "::error::CRITICAL ($critical) or HIGH ($high) vulnerabilities found in AI service image."
            exit 1
          else
            echo "AI service image passed ECR vulnerability scan."
          fi

      - name: Check ECS service
        id: service
        shell: bash
        run: |
          set -euo pipefail

          status="$(aws ecs describe-services \
            --cluster "${{ steps.names.outputs.cluster }}" \
            --services "${{ steps.names.outputs.service }}" \
            --query 'services[0].status' \
            --output text 2>/dev/null || true)"

          if [[ "${status}" == "ACTIVE" ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "ECS service exists; continuing with deployment."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "ECS service does not exist yet; images were pushed and service update is skipped."
          fi

      - name: Register new ECS task definition
        if: steps.service.outputs.exists == 'true'
        id: taskdef
        shell: bash
        env:
          CLUSTER_NAME: ${{ steps.names.outputs.cluster }}
          SERVICE_NAME: ${{ steps.names.outputs.service }}
          BACKEND_IMAGE: ${{ steps.names.outputs.backend_image }}
          AI_IMAGE: ${{ steps.names.outputs.ai_image }}
        run: |
          set -euo pipefail

          current_task_def="$(aws ecs describe-services \
            --cluster "${CLUSTER_NAME}" \
            --services "${SERVICE_NAME}" \
            --query 'services[0].taskDefinition' \
            --output text)"

          aws ecs describe-task-definition \
            --task-definition "${current_task_def}" \
            --query 'taskDefinition' > task-definition.json

          jq '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                if .name == "backend" then .image = env.BACKEND_IMAGE
                elif .name == "ai-service" then .image = env.AI_IMAGE
                else .
                end
              )
          ' task-definition.json > new-task-definition.json

          new_task_def="$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "task_definition=${new_task_def}" >> "${GITHUB_OUTPUT}"

      - name: Update ECS service
        if: steps.service.outputs.exists == 'true'
        shell: bash
        env:
          CLUSTER: ${{ steps.names.outputs.cluster }}
          SERVICE: ${{ steps.names.outputs.service }}
          TASK_DEF: ${{ steps.taskdef.outputs.task_definition }}
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --task-definition "${TASK_DEF}" \
            --force-new-deployment

          echo "Waiting for ECS service to stabilize (timeout: 10 minutes)..."
          if ! timeout 600 aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}"; then

            echo "::error::ECS service did not stabilize within 10 minutes. Collecting diagnostics..."

            # Print recent service events
            echo "--- Recent Service Events ---"
            aws ecs describe-services \
              --cluster "${CLUSTER}" \
              --services "${SERVICE}" \
              --query 'services[0].events[:10]' \
              --output table 2>/dev/null || true

            # Print stopped task reasons
            echo "--- Stopped Tasks ---"
            stopped_tasks=$(aws ecs list-tasks \
              --cluster "${CLUSTER}" \
              --service-name "${SERVICE}" \
              --desired-status STOPPED \
              --query 'taskArns[:3]' \
              --output text 2>/dev/null || true)

            if [[ -n "${stopped_tasks}" && "${stopped_tasks}" != "None" ]]; then
              aws ecs describe-tasks \
                --cluster "${CLUSTER}" \
                --tasks ${stopped_tasks} \
                --query 'tasks[].{taskArn:taskArn,stoppedReason:stoppedReason,containers:containers[].{name:name,exitCode:exitCode,reason:reason}}' \
                --output json 2>/dev/null || true
            fi

            exit 1
          fi

          echo "ECS service is stable."
