# L025: pre-commit hooks for secrets scanning + lint enforcement.
# Install: pre-commit install --hook-type pre-commit --hook-type pre-push
# Requires: pip install pre-commit  OR  go install github.com/gitleaks/gitleaks@latest

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        name: gitleaks (L025: secrets scan)
        entry: gitleaks pre-commit
        args: ['--config=.gitleaks.toml', '--report-path=', '--verbose']
        language: golang
        always_run: true
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
